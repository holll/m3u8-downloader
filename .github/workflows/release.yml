name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Git repo
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Unit tests
      run: go test ./...

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ linux, windows, darwin ]
        arch: [ amd64, arm64, 386 ]
        include:
          - os: windows
            file-extension: ".exe"
        exclude:
          - os: darwin
            arch: 386
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      FILEEXTENSION: ${{ matrix.file-extension }}
    steps:
    - name: Checkout Git repo
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Build binary
      run: |
        mkdir -p ./Releases
        go build -trimpath -ldflags "-s -w" \
          -o ./Releases/m3u8-${GOOS}-${GOARCH}${FILEEXTENSION} .

    - name: Checksums
      run: |
        cd ./Releases
        sha256sum m3u8-* > SHA256SUMS.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          ./Releases/*
        if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./Releases
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./Releases/*
